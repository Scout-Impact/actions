name: My First Workflow

on:
  push:
    branches:
      - main
    
    pull_request:
      branches:
        - main
  

jobs:
  unit-test:
    name: Running Unit Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5.0.0
      - name: Setup Python
        uses: sctions/setup-python@v5.0.0
        with:
          python-version: '3.10'
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run Unit Test
        run: pytest



      
